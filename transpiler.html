<!DOCTYPE html>
<html>

<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap');

    .cols {
      display: flex;
      gap: 16px;
    }

    .pane {
      gap: 8px;
      flex: 1;
      min-width: 0;

    }

    body {
      background-color: #222222;
      color: #e8e8e8;
      font-family: 'IBM Plex Mono', monospace;
      padding-left: 10px;
      padding-right: 10px;
    }
  </style>

  <script type="module">
    import { EditorView, basicSetup } from "https://esm.sh/codemirror"
    import { EditorState } from "https://esm.sh/@codemirror/state"
    import { oneDark } from 'https://esm.sh/@codemirror/theme-one-dark';
    import { cpp } from 'https://esm.sh/@codemirror/lang-cpp';
    import { octave } from 'https://esm.sh/@codemirror/legacy-modes/mode/octave' // matlab
    import { StreamLanguage } from 'https://esm.sh/@codemirror/language';


    const srcView = new EditorView({
      extensions: [basicSetup, oneDark, StreamLanguage.define(octave),
        EditorView.theme({
          "&": { maxHeight: "500px" },
          ".cm-scroller": { overflow: "auto" },
        }),
        EditorView.updateListener.of((update) => {
          if (update.docChanged) {
            runTranspile();
          }
        }),
        EditorView.lineWrapping
      ],
      parent: document.getElementById('src-editor'),
      doc: "% Paste your matlab source code here...\n\n\n\n\n\n\n\n\n"
    });

    const typeView = new EditorView({
      extensions: [basicSetup, oneDark,
        EditorView.theme({
          "&": { maxHeight: "500px" },
          ".cm-scroller": { overflow: "auto" },
        }),
        EditorView.updateListener.of((update) => {
          if (update.docChanged) {
            runTranspile();
          }
        }),
        EditorView.lineWrapping
      ],
      parent: document.getElementById('types-editor'),
      doc: "# Paste your types and functions here...\n# dT: float\n# z: Vector15\nx: Matrix3_3\n\n\n\n\n\n"
    });

    const outView = new EditorView({
      extensions: [basicSetup, oneDark, cpp(), EditorState.readOnly.of(true),
        EditorView.theme({
          "&": { maxHeight: "500px" },
          ".cm-scroller": { overflow: "auto" },
        }),
        EditorView.lineWrapping
      ],
      parent: document.getElementById('out-editor'),
      doc: "// C++ output will appear here...\n\n\n\n\n\n\n\n\n"
    });

    const errView = new EditorView({
      extensions: [basicSetup, oneDark, EditorState.readOnly.of(true),
        EditorView.theme({
          "&": { maxHeight: "500px" },
          ".cm-scroller": { overflow: "auto" },
        }),
        EditorView.lineWrapping
      ],
      parent: document.getElementById('err-editor'),
      doc: "No errors / warnings!...\n\n\n\n\n\n\n\n\n"
    });

    // get input value
    const getSrc = () => srcView.state.doc.toString();
    const getTypes = () => typeView.state.doc.toString();

    // set output value
    const setOut = (text) => outView.dispatch({
      changes: { from: 0, to: outView.state.doc.length, insert: text }
    });

    // set output error value
    const setErr = (text) => errView.dispatch({
      changes: { from: 0, to: errView.state.doc.length, insert: text }
    });

    async function loadWasm() {
      const { default: init, transpile_wrap } = await import('./pkg/matlab_to_eigen_conv.js');
      await init();
      window.wasmTranspile = transpile_wrap;
    }

    loadWasm();

    function runTranspile() {
      const ml_src = getSrc();
      const type_src = getTypes();
      if (!ml_src) return;

      if (window.wasmTranspile) {
        try {
          const result = window.wasmTranspile(ml_src, type_src);
          setOut(result.result);
          setErr(result.warnings);
        } catch (e) {
          setOut('');
          setErr(String(e));
        }
      } else {
        setOut('');
        setErr('Error loading wasm module.');
      }
    }

    const srcScroller = srcView.scrollDOM;
    const outScroller = outView.scrollDOM;

    srcScroller.addEventListener('scroll', () => {
      const pct = srcScroller.scrollTop / (srcScroller.scrollHeight - srcScroller.clientHeight);
      outScroller.scrollTop = pct * (outScroller.scrollHeight - outScroller.clientHeight);
    });

    outScroller.addEventListener('scroll', () => {
      const pct = outScroller.scrollTop / (outScroller.scrollHeight - outScroller.clientHeight);
      srcScroller.scrollTop = pct * (srcScroller.scrollHeight - srcScroller.clientHeight);
    });


  </script>

</head>

<body>
  <h1>Matlab -> Eigen Transpiler</h1>
  <div class="cols">
    <div class="pane">
      <h3>Matlab Input</h3>
      <div id="src-editor"></div>

      <h3>Types Input</h3>
      <div id="types-editor"></div>
    </div>

    <div class="pane">
      <h3>C++ Output</h3>
      <div id="out-editor"></div>

      <h3>Errors / Warnings</h3>
      <div id="err-editor"></div>
    </div>
  </div>

</body>

</html>
